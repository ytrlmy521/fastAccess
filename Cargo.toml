[package]
name = "fastaccess"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A lightweight Windows Recent Items launcher"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
lnk = "0.6.4"
nucleo-matcher = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.17.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
